name: Run Unit Tests

on:
  push:
  pull_request:

jobs:
  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_solid_test?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_solid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_solid_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Verify Prisma Client
        run: |
          echo "Verificando arquivos gerados pelo Prisma..."
          ls -la src/generated/prisma

      - name: Run Unit Tests
        run: npm run test

